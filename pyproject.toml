[project]
name = "smartcommit"
version = "0.1.0"
description = "AI-powered Git commit message generator using Conventional Commits"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Joy", email = "your.email@example.com" }]
license = { text = "MIT" }
keywords = ["git", "commit", "ai", "conventional-commits", "automation"]
dependencies = ["google-genai>=0.2.2", "python-dotenv>=1.0.0"]

[project.scripts]
smartcommit = "smartcommit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
